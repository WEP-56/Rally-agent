name: Rally release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build without moving it
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  client-and-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: windows }
          - { os: ubuntu-24.04, target: linux }
          - { os: ubuntu-24.04, target: android }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - name: Use validation fixes from the dispatch revision
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CHECKS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CHECKS_SHA"
          git restore --source="$CHECKS_SHA" --worktree -- tests packages/coding-agent/test
      - uses: actions/setup-node@v4
        with: { node-version: '24.11.1', cache: npm }
      - shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --ignore-scripts
      - run: npm run hydrate:model-data
      - run: npm run build:packages
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.node.json
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.web.json
      - run: node --test tests/cloud/profiles.test.mjs
      - run: node --test tests/cloud/cache.test.mjs
      - run: node --test tests/release.test.mjs
      - name: Verify external agent discovery and offline ACP sessions
        if: matrix.target != 'android'
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-external-worker-settings.test.ts
      - if: matrix.target == 'windows'
        run: node node_modules/electron/install.js
      - if: matrix.target == 'windows'
        run: npm run dist
      - if: matrix.target == 'windows'
        run: node scripts/verify-windows.mjs
      - if: matrix.target == 'windows'
        env:
          RALLY_TEST_DESKTOP: release/win-unpacked
        run: node --test tests/agent-browser/packaged.test.mjs
      - if: matrix.target == 'windows'
        run: node --experimental-vm-modules --test tests/attachments/renderer.test.mjs tests/attachments/client-bridge.test.mjs tests/cloud/connection-ui.test.mjs
      - name: Verify browser takeover
        if: matrix.target == 'windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/agent-browser
        run: node --experimental-vm-modules --test tests/agent-browser/managed.test.mjs tests/agent-browser/privacy.test.mjs tests/agent-browser/renderer.test.mjs
      - name: Verify credential callbacks and direct answers
        if: matrix.target == 'windows'
        working-directory: packages/coding-agent
        run: |
          node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-website-accounts.test.ts
          node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-relay.test.ts
          node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-questions.test.ts
          node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-supervisor.test.ts -t "escalates questions via"
          node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-supervisor.test.ts -t "shows one built-in Rally management Skill"
          node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-supervisor.test.ts -t "dispatches a role worker|routes an external|closes the external ACP session"
      - if: matrix.target == 'linux'
        run: node node_modules/playwright/cli.js install-deps chromium
      - if: matrix.target == 'linux'
        run: npm run build:server && bash scripts/cloud/package-linux.sh
      - if: matrix.target != 'android'
        run: node --test tests/attachments/resource-store.test.mjs tests/attachments/lifecycle.test.mjs tests/attachments/preview.test.mjs tests/attachments/download.test.mjs tests/attachments/gateway.test.mjs tests/attachments/message.test.mjs tests/attachments/directory-read.test.mjs tests/attachments/tools.test.mjs
      - if: matrix.target == 'windows'
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-ipc-lifecycle.test.ts
      - if: matrix.target == 'windows'
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-desktop.test.ts
      - if: matrix.target == 'windows'
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/suite/rally-main-shutdown.test.ts
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with: { packages: '', log-accepted-android-sdk-licenses: false }
      - if: matrix.target == 'android'
        shell: bash
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
          test -n "$STORE" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_STORE_PASSWORD" && test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          export ANDROID_KEYSTORE="$RUNNER_TEMP/rally.p12"
          printf %s "$STORE" | base64 -d > "$ANDROID_KEYSTORE"
          npm run dist:android
          node --experimental-vm-modules --test tests/cloud/renderer.test.mjs
          node --experimental-vm-modules --test tests/attachments/client-bridge.test.mjs
      - if: always() && matrix.target == 'android'
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/rally.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*-setup.exe
            release/*-android-arm64-v8a.apk
            release/*-android-armeabi-v7a.apk
            release/*-android-x86_64.apk
            release/rally-server-*.tar.gz
  draft:
    needs: client-and-server
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: '24.11.1' }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: node scripts/release-checksums.mjs dist --tag "$RELEASE_TAG"
      - working-directory: dist
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          sha256sum -c SHA256SUMS
          notes="../docs/发布说明-${RELEASE_TAG#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Rally ${RELEASE_TAG#v}" --notes-file "$notes" *.exe *.apk *.tar.gz SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Rally ${RELEASE_TAG#v}" --generate-notes *.exe *.apk *.tar.gz SHA256SUMS
          fi
