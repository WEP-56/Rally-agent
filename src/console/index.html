<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/console.css"><title>Rally · 部署控制台</title></head><body><main><header><div class="brand"><img width="36" height="36" src="/mark.png" alt=""> Rally <small>部署控制台</small></div><button id="logout" hidden>退出</button></header><section id="login"><h1>连接你的 Rally 实例</h1><p>输入部署时生成的管理密钥，管理设备与接入权限。</p><form id="auth"><label>管理密钥<input id="admin" type="password" required autocomplete="current-password"></label><button class="primary">进入控制台</button></form></section><div id="panel" hidden><h1>设备与接入</h1><p id="instance"></p><section><h2>签发接入密钥</h2><form id="issue"><label>设备名称<input id="name" maxlength="80" required placeholder="例如：我的手机"></label><button class="primary">生成一次性密钥</button></form><output id="issued"></output></section><section><div class="row"><h2>设备连接</h2><button id="refresh">刷新</button></div><div id="devices"></div></section><section><div class="row"><div><h2>允许新设备配对</h2><p>关闭后已连接的设备仍可使用。</p></div><button id="pairing"></button></div></section></div><p role="status" aria-live="polite" id="status"></p></main><script src="/console.js" defer></script></body></html>
